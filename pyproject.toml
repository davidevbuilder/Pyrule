[project]
name = "py-rule-lib"
version = "0.3.0"
description = "A Python library for creating and validating rules and conditions"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
    { name = "Davi Sousa" }
]

keywords = [
    "python",
    "rules",
    "validation",
    "conditions"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyrule"]